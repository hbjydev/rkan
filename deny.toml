[advisories]
version = 2
ignore = [
  "RUSTSEC-2026-0592",  # url doesn't have a patched reqwest or octocrab release yet
  "RUSTSEC-2026-0543",  # chrono is unmaintained
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT-0",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
