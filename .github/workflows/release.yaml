name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-26-intel
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-26
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Repo
        uses: bitshift-systems/.github/actions/setup-repo@a0aab65f0651370a9be252117577556a9ee67bab # setup-repo-v2.2.1
        with:
          cache-key: release-build
          install-args: rust aqua:EmbarkStudios/cargo-deny hk

      - name: Build release binary
        id: build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mise run build-release --target ${{ matrix.target }}
          mv "target/${{ matrix.target }}/release/rkan${{ matrix.ext }}" "target/${{ matrix.target }}/release/rkan-${RELEASE_TAG}${{ matrix.ext }}"
          echo "path=target/${{ matrix.target }}/release/rkan-${RELEASE_TAG}${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: ${{ steps.build.outputs.path }}

      - name: Bundle attestation
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ASSET_PATH: ${{ steps.build.outputs.path }}
        run: |
          cp "${BUNDLE_PATH}" "${ASSET_PATH}.sigstore.json"

      - name: Upload release builds to CI
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_PATH: ${{ steps.build.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$ASSET_PATH" "${ASSET_PATH}.sigstore.json" --clobber

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-26.04
    needs: build
    environment: release
    permissions:
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Setup Repo
        uses: bitshift-systems/.github/actions/setup-repo@a0aab65f0651370a9be252117577556a9ee67bab # setup-repo-v2.2.1
        with:
          cache-key: publish
          install-args: rust

      - name: Publish
        run: cargo publish --all-features --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
