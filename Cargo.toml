[package]
name = "rkan"
description = "A Rust-based CLI tool for managing CKAN metadata files and repositories."
repository = "https://github.com/hbjydev/rkan"
readme = "README.md"
license = "Apache-2.0"
version = "0.3.0"
edition = "2024"

[dependencies]
thiserror = "2.0"
clap = { version = "4.6.0", features = ["derive", "env"] }
chrono = { version = "0.4.44", features = ["serde"] }
toml = { version = "1.1.2", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.2", features = ["stream"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3"
zip = "9.6.0"
futures-util = "0.3"
hex = "0.4"
regex = "1"
tracing-indicatif = "0.3"
indicatif = "0.18"
indexmap = { version = "2", features = ["serde"] }
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "rustls", "rustls-ring"] }

[package.metadata.binstall]
pkg-fmt = "bin"
